<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- validate name -->
            <label for="first name">First Name</label>
            <input type="text" id="first name" name="first name" minlength="2" required>
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" minlength="2" required>

        <!-- valid email -->
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>  

        <!-- tshirt color (3 options;require 1; validate) -->        
            <fieldset>
              <legend>What is your preferred t-shirt color?</legend>
              <label><input type="radio" name="color" value="black"> Black</label>
              <label><input type="radio" name="color" value="purple"> Purple</label>
              <label><input type="radio" name="color" value="green"> Green</label>
            </fieldset>

        <!-- tshirt size (6 options; require 1; validate)-->


        <!-- submit button-->        
            <button type="submit">Submit</button>        
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>© 2026. Created by Ria as part of Migracode BCN onboarding module.</p>
    </footer>
  </body>
</html>
